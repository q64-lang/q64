# Builds the `q64` and `qube` binaries and publishes them as a GitHub Release.
# Everything is built on a single x86_64 Linux runner via Zig cross-compilation:
#
#   * qube is pure Zig -> all six OS/arch targets cross-compile directly.
#   * q64 links a static Binaryen archive, so each target needs the matching
#     libbinaryen.a. The host (linux-amd64) lib comes from init.sh; the macOS
#     libs are pulled from q64's CDN cache (cdn.q64.dev/toolchain, the same
#     prebuilt archives init.sh restores) and swapped into vendor/binaryen
#     before the per-target `zig build -Dtarget=...`.
#
# The qubepods builder container reads `manifest.json` from a release to
# discover the binary URLs + sha256s.
#
# This is a MANUAL release action — it never runs on a routine push to main
# (we push far more often than we release). Triggers:
#   - workflow_dispatch with a `version` input (e.g. 0.0.1)
#                        -> immutable stable release at tag `v<version>`,
#                           cut from the dispatched ref's commit.
#   - workflow_dispatch with no version (run on `main`)
#                        -> refresh the moving `nightly` prerelease.
#   - push tag `v*`      -> immutable stable release at that tag.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.0.1 (publishes an immutable v<version> release). Leave blank to refresh nightly.'
        required: false
        default: ''
  push:
    tags: ['v*']

# Least-privilege default for a public repo: the build job runs read-only
# (it doesn't need to push, tag, or release), and only the release job
# elevates to `contents: write`. No PAT, no action secrets -- the ambient
# GITHUB_TOKEN is per-run and scoped to this repo.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # CDN base for the prebuilt Binaryen static libs (same archives init.sh
  # restores). Per-target tarball: binaryen-<ver>-<arch>-<os>.tar.gz.
  BINARYEN_CDN: https://cdn.q64.dev/toolchain
  BINARYEN_VERSION: '129'

jobs:
  build:
    # One x86_64 Linux runner cross-compiles every published target. q64 swaps
    # in a per-target Binaryen lib from the CDN (macОS + windows-gnu); qube is
    # pure Zig. Deferred q64 targets: linux-arm64 (linkBinaryen's Linux branch
    # resolves libstdc++ via the host's g++, x86_64 only) and windows-arm64
    # (no aarch64-windows Binaryen lib built yet). Adding one = a CDN Binaryen
    # lib + one entry in the build_q64 list below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Cache only the slow, immutable downloads: the Zig toolchain + wasmtime
      # C API. NOT vendor/binaryen — the q64 cross-build step below rewrites it
      # per target (macOS, then windows), so caching it would persist the LAST
      # swapped lib under this linux key and poison the next run's linux build
      # (init.sh would skip its restore and q64-linux would link the windows
      # archive). init.sh re-fetches the linux binaryen from the CDN in seconds.
      - name: Cache vendored toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/zig
            vendor/wasmtime
          key: vendor-linux-amd64-v2-${{ hashFiles('init.sh') }}

      - name: init.sh (Zig + wasmtime + Binaryen)
        run: ./init.sh

      # qube is pure Zig: cross-compile every OS/arch straight from the runner.
      # Windows uses the -gnu ABI (zig's bundled MinGW + libc++), matching the
      # ABI q64's Windows Binaryen lib was built against.
      - name: Build qube (all targets)
        working-directory: qube
        run: |
          set -euo pipefail
          declare -A T=(
            [linux-amd64]=x86_64-linux
            [linux-arm64]=aarch64-linux
            [macos-amd64]=x86_64-macos
            [macos-arm64]=aarch64-macos
            [windows-amd64]=x86_64-windows-gnu
            [windows-arm64]=aarch64-windows-gnu
          )
          mkdir -p ../out
          for plat in "${!T[@]}"; do
            triple="${T[$plat]}"
            echo "::group::qube $plat ($triple)"
            ../vendor/zig/zig build -Doptimize=ReleaseFast -Dtarget="$triple"
            if [[ "$plat" == windows-* ]]; then
              cp zig-out/bin/qube.exe "../out/qube-${plat}.exe"
            else
              cp zig-out/bin/qube "../out/qube-${plat}"
            fi
            echo "::endgroup::"
          done

      # q64 (host, linux-amd64): init.sh already vendored the linux lib.
      - name: Build q64 (linux-amd64)
        working-directory: q64
        run: |
          set -euo pipefail
          ../vendor/zig/zig build -Doptimize=ReleaseFast
          cp zig-out/bin/q64 ../out/q64-linux-amd64

      # q64 (macОS + windows): swap the CDN Binaryen lib for the target's, then
      # cross-build. build.zig's non-Linux branch links zig's bundled libc++,
      # ABI-matched to the zig-built archive — so these link cleanly from Linux.
      - name: Build q64 (macOS amd64+arm64, windows amd64)
        working-directory: q64
        run: |
          set -euo pipefail
          # build_q64 <zig-triple> <binaryen-key> <out-name>
          # zig emits zig-out/bin/q64 (q64.exe for windows); copy to <out-name>.
          build_q64() {
            local triple="$1" key="$2" out="$3"
            echo "::group::q64 -> $out ($triple)"
            local tar="$RUNNER_TEMP/binaryen-$key.tar.gz"
            curl -fsSL "$BINARYEN_CDN/binaryen-$BINARYEN_VERSION-$key.tar.gz" -o "$tar"
            rm -rf ../vendor/binaryen
            tar -xzf "$tar" -C ../vendor   # unpacks top-level binaryen/
            test -f ../vendor/binaryen/lib/libbinaryen.a
            ../vendor/zig/zig build -Doptimize=ReleaseFast -Dtarget="$triple"
            local src=zig-out/bin/q64; [[ "$out" == *.exe ]] && src=zig-out/bin/q64.exe
            cp "$src" "../out/$out"
            echo "::endgroup::"
          }
          build_q64 x86_64-macos       x86_64-darwin  q64-macos-amd64
          build_q64 aarch64-macos      aarch64-darwin q64-macos-arm64
          build_q64 x86_64-windows-gnu x86_64-windows q64-windows-amd64.exe

      # The documentation index (keywords, builtin types, diagnostics) the
      # docs.q64.dev site renders — architecture-independent, produced once
      # from the freshly built linux q64 (the docs deploy downloads this asset).
      - name: Generate doc.json
        run: ./out/q64-linux-amd64 doc --json > out/doc.json

      - name: Stage checksums
        working-directory: out
        run: shasum -a 256 q64-* qube-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    # Publish when: a version was explicitly requested (intentional release on
    # any branch), the run is on main (nightly refresh), or a v* tag was pushed.
    # A bare dispatch on a feature branch builds + uploads artifacts but does
    # not cut a release.
    if: >-
      github.event.inputs.version != '' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries
          merge-multiple: true

      - name: Assemble release dir
        id: assemble
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/q64-*  release/
          cp artifacts/qube-* release/
          cp artifacts/doc.json release/
          ( cd release && sha256sum q64-* qube-* > SHA256SUMS )

          # Resolve release tag + whether this is a prerelease.
          version="${{ github.event.inputs.version }}"
          if [[ -n "$version" ]]; then
            tag="v${version#v}"          # accept "0.0.1" or "v0.0.1"
            prerelease=false
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            prerelease=false
          else
            tag="nightly"
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          # manifest.json: the contract the qubepods builder container reads on
          # cold start to pick (and verify) the right binaries. Generated from
          # whatever platforms are present, so adding a target is enough.
          TAG="$tag" COMMIT="$GITHUB_SHA" BUILT_AT="$built_at" BASE_URL="$base_url" \
            python3 - <<'PY'
          import json, os, pathlib
          rel = pathlib.Path("release")
          sums = {}
          for line in (rel / "SHA256SUMS").read_text().splitlines():
              sha, name = line.split()
              sums[name] = sha
          bins = {"q64": {}, "qube": {}}
          for name in sums:
              tool, _, plat = name.partition("-")  # q64-linux-amd64 / qube-windows-amd64.exe
              plat = plat.removesuffix(".exe")
              if tool in bins:
                  bins[tool][plat] = {
                      "url": f"{os.environ['BASE_URL']}/{name}",
                      "sha256": sums[name],
                  }
          manifest = {
              "version": os.environ["TAG"],
              "commit": os.environ["COMMIT"],
              "builtAt": os.environ["BUILT_AT"],
              "binaries": bins,
          }
          (rel / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          ls -la release
          cat release/manifest.json

      - name: Publish / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.assemble.outputs.tag }}"
          notes="q64 + qube binaries built from ${GITHUB_SHA}.

          Consumed by sibling repos and the qubepods builder container via
          \`manifest.json\` (binary URLs + sha256). qube ships linux + macOS +
          windows on amd64+arm64; q64 ships linux-amd64, macOS (amd64+arm64),
          and windows-amd64. Deferred: q64 linux-arm64 and q64 windows-arm64
          (need their Binaryen libs)."
          assets=(release/q64-* release/qube-* release/SHA256SUMS release/manifest.json release/doc.json)

          if [ "${{ steps.assemble.outputs.prerelease }}" = "true" ]; then
            # `nightly` is a moving target. We never DELETE it — we update the
            # target/notes and clobber-upload only the files this build produced.
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --target "${GITHUB_SHA}" --notes "$notes" --prerelease
            else
              gh release create "$tag" --target "${GITHUB_SHA}" --title "$tag" --notes "$notes" --prerelease
            fi
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            # Versioned releases (vX.Y.Z) are immutable: create fails if the tag
            # already has a release, which is the behaviour we want. --target cuts
            # the tag at this commit.
            gh release create "$tag" --target "${GITHUB_SHA}" --title "$tag" --notes "$notes" "${assets[@]}"
          fi
