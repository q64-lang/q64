<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- user-scalable=no: no double-tap / pinch zoom; the app owns all gestures. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#07090d" />
<title>QView · retained · q64 → wasm32 → WebGPU</title>
<style>
  :root { color-scheme: dark; }
  /* App-shell: the whole page is the app — no scroll, no bounce/overscroll, no
     text selection or long-press callout anywhere. Gestures belong to the canvas. */
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: #07090d; color: #e6edf3;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; touch-action: none; }
  header { display: flex; align-items: center; gap: 0.75rem;
    padding: max(env(safe-area-inset-top), 0.75rem) 1rem 0; font: 600 0.8rem ui-monospace, monospace;
    letter-spacing: 0.2em; text-transform: uppercase; color: #5fd4ff; }
  header .ttl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Snap captures the device's own WebGPU canvas + uploads it; Copy puts the
     last snap URL on the clipboard for a fast paste. */
  #snap, #copy { flex: 0 0 auto; -webkit-appearance: none; appearance: none; cursor: pointer;
    border: 0; border-radius: 8px; padding: 0.4rem 0.8rem;
    font: 600 0.72rem ui-monospace, monospace; letter-spacing: 0.1em; }
  #snap { background: #0a84ff; color: #fff; }
  #copy { background: #2c2c2e; color: #5fd4ff; }
  #snap:disabled, #copy:disabled { opacity: 0.4; }
  /* The canvas owns all gestures (touch-action:none): no scroll-steal of a
     slider drag, no long-press callout — every pointer event reaches our host.
     min-height/width:0 is essential: a flex item defaults to min-*:auto, which
     for a canvas equals its intrinsic size (the width/height ATTRIBUTES we set
     each resize). Without this, once resize() sets a large backing store the
     canvas can never shrink below it — clientHeight stays pinned at the old big
     value, so maxBound() goes too small and the page can't scroll to the bottom
     after the window is made smaller. */
  /* flex-basis:0 (not auto) is essential: with `auto`, the flex basis is the
     canvas's INTRINSIC height = its height ATTRIBUTE, which resize() rewrites
     every frame — so a ResizeObserver re-fires from our own resize and loops
     (load stays blank, scroll vibrates). basis:0 sizes the canvas purely from
     the flex container, independent of the attribute. */
  #gpu { flex: 1 1 0; width: 100%; min-width: 0; min-height: 0; display: block; touch-action: none; }
  /* Hidden text-capture input for text_input fields: invisible but focusable, so
     tapping a field can summon the iOS/Android soft keyboard + IME. We draw the
     text + caret ourselves; this only feeds keystrokes. font-size:16px avoids
     iOS's zoom-on-focus. pointer-events:none so taps still reach the canvas.
     PINNED top-left (fixed, always in the visible viewport) so iOS never
     auto-scrolls the page to "reveal" the focused input — WE own the field's
     on-screen position via our scroll. 1px so it can't be seen or interacted. */
  /* Invisible (transparent colors, not opacity:0) but a REAL, on-screen focus
     target POSITIONED OVER THE FIELD by JS (positionKbd). iPhone Safari dismisses
     the keyboard if the focused input isn't where the interaction is; pinning it
     far away (top-left) made iOS bail once the keyboard settled. pointer-events:
     none so taps still reach the canvas (we hit-test + place the caret). The
     fixed top/left here are just a fallback before positionKbd runs. */
  #kbd, #kbdm { position: fixed; top: 0; left: 0; width: 12px; height: 18px;
    border: 0; padding: 0; margin: 0; resize: none; outline: none; pointer-events: none;
    -webkit-appearance: none; appearance: none;
    background: transparent; color: transparent; caret-color: transparent; font-size: 16px; }
  /* Bring-up status line (host/wasm/WebGPU). Commented out — not user-facing.
     Re-enable with the #log div below to see load diagnostics on-screen. */
  /* #log { padding: 0.5rem 1rem calc(env(safe-area-inset-bottom) + 0.5rem); font: 0.8rem ui-monospace, monospace; color: #6b7484; } */
  /* Logs: an on-page console (button + scrollable panel) so the engine/scene/
     injection trace is readable on-device without a desktop debugger. Above the
     canvases (which own gestures) with pointer-events:auto so taps reach it. */
  #logsbtn { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 100;
    -webkit-appearance: none; appearance: none; cursor: pointer; border: 1px solid #2a4a63;
    background: rgba(10,16,24,.82); color: #cfe8ff; border-radius: 8px; padding: 8px 14px;
    font: 600 0.78rem ui-monospace, monospace; pointer-events: auto; }
  #logspanel { position: fixed; inset: 8px 8px 60px 8px; z-index: 99; display: none; overflow: auto;
    margin: 0; padding: 10px; background: rgba(6,9,14,.96); color: #d7e6f5; border: 1px solid #1c2330;
    border-radius: 10px; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, monospace;
    pointer-events: auto; -webkit-user-select: text; user-select: text; }
</style>
<script>
  // Capture EVERYTHING from the very first line (before app.js / the inject shim)
  // into a ring buffer the Logs panel renders. Mirrors console + window errors +
  // the per-hop injection trace flags written to sessionStorage.
  (function () {
    var BUF = (window.__qnLogs = []);
    function fmt(a) { try { return typeof a === 'object' ? JSON.stringify(a) : String(a); } catch (e) { return '[?]'; } }
    function push(tag, args) {
      var t = new Date().toISOString().slice(11, 23);
      BUF.push(t + ' ' + tag + Array.prototype.map.call(args, fmt).join(' '));
      if (BUF.length > 800) BUF.shift();
      render();
    }
    ['log', 'warn', 'error'].forEach(function (k) {
      var o = console[k].bind(console);
      console[k] = function () { push(k === 'log' ? '' : '[' + k + '] ', arguments); o.apply(console, arguments); };
    });
    window.addEventListener('error', function (e) { push('[window error] ', [e.message, (e.filename || '') + ':' + (e.lineno || ''), e.error && e.error.stack]); });
    window.addEventListener('unhandledrejection', function (e) { var r = e.reason; push('[reject] ', [r && r.stack ? r.stack : String(r)]); });
    function traceFlags() {
      try {
        var ks = ['qnT_recv', 'qnT_show', 'qnT_set', 'qnT_shim'], out = [];
        for (var i = 0; i < ks.length; i++) out.push(ks[i].slice(4) + '=' + (sessionStorage.getItem(ks[i]) || '-'));
        out.push('win=' + (window.__qubonautGame ? 'Y' : 'N'));
        return 'inject trace · ' + out.join(' ');
      } catch (e) { return 'inject trace · (no sessionStorage)'; }
    }
    function render() {
      var p = document.getElementById('logspanel');
      if (p && p.style.display !== 'none') { p.textContent = traceFlags() + '\n────────\n' + BUF.join('\n'); p.scrollTop = p.scrollHeight; }
    }
    window.__qnRenderLogs = render;
    window.addEventListener('DOMContentLoaded', function () {
      var b = document.getElementById('logsbtn'), p = document.getElementById('logspanel');
      if (b && p) b.addEventListener('click', function () {
        var show = p.style.display === 'none' || !p.style.display;
        p.style.display = show ? 'block' : 'none';
        b.textContent = show ? 'Hide' : 'Logs';
        if (show) render();
      });
    });
  })();
</script>
</head>
<body>
  <header><span class="ttl">QView · retained</span><button id="snap">Snap</button><button id="copy" disabled>Copy</button></header>
  <canvas id="gpu"></canvas>
  <input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  <textarea id="kbdm" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
  <!-- <div id="log">loading…</div> --> <!-- bring-up status line; status still goes to console.log -->
  <button id="logsbtn">Logs</button>
  <pre id="logspanel"></pre>

  <script type="module" src="./app.js"></script>
</body>
</html>
