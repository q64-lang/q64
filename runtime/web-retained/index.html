<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- user-scalable=no: no double-tap / pinch zoom; the app owns all gestures. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#07090d" />
<title>QView · retained · q64 → wasm32 → WebGPU</title>
<style>
  :root { color-scheme: dark; }
  /* App-shell: the whole page is the app — no scroll, no bounce/overscroll, no
     text selection or long-press callout anywhere. Gestures belong to the canvas. */
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: #07090d; color: #e6edf3;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; touch-action: none; }
  header { display: flex; align-items: center; gap: 0.75rem;
    padding: max(env(safe-area-inset-top), 0.75rem) 1rem 0; font: 600 0.8rem ui-monospace, monospace;
    letter-spacing: 0.2em; text-transform: uppercase; color: #5fd4ff; }
  header .ttl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Snap captures the device's own WebGPU canvas + uploads it; Copy puts the
     last snap URL on the clipboard for a fast paste. */
  #snap, #copy { flex: 0 0 auto; -webkit-appearance: none; appearance: none; cursor: pointer;
    border: 0; border-radius: 8px; padding: 0.4rem 0.8rem;
    font: 600 0.72rem ui-monospace, monospace; letter-spacing: 0.1em; }
  #snap { background: #0a84ff; color: #fff; }
  #copy { background: #2c2c2e; color: #5fd4ff; }
  #snap:disabled, #copy:disabled { opacity: 0.4; }
  /* The canvas owns all gestures (touch-action:none): no scroll-steal of a
     slider drag, no long-press callout — every pointer event reaches our host.
     min-height/width:0 is essential: a flex item defaults to min-*:auto, which
     for a canvas equals its intrinsic size (the width/height ATTRIBUTES we set
     each resize). Without this, once resize() sets a large backing store the
     canvas can never shrink below it — clientHeight stays pinned at the old big
     value, so maxBound() goes too small and the page can't scroll to the bottom
     after the window is made smaller. */
  #gpu { flex: 1 1 auto; width: 100%; min-width: 0; min-height: 0; display: block; touch-action: none; }
  /* Hidden text-capture input for text_input fields: invisible but focusable, so
     tapping a field can summon the iOS/Android soft keyboard + IME. We draw the
     text + caret ourselves; this only feeds keystrokes. font-size:16px avoids
     iOS's zoom-on-focus. pointer-events:none so taps still reach the canvas.
     PINNED top-left (fixed, always in the visible viewport) so iOS never
     auto-scrolls the page to "reveal" the focused input — WE own the field's
     on-screen position via our scroll. 1px so it can't be seen or interacted. */
  #kbd, #kbdm { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0;
    pointer-events: none; border: 0; padding: 0; margin: 0; resize: none;
    background: transparent; color: transparent; caret-color: transparent; font-size: 16px; }
  /* Bring-up status line (host/wasm/WebGPU). Commented out — not user-facing.
     Re-enable with the #log div below to see load diagnostics on-screen. */
  /* #log { padding: 0.5rem 1rem calc(env(safe-area-inset-bottom) + 0.5rem); font: 0.8rem ui-monospace, monospace; color: #6b7484; } */
</style>
</head>
<body>
  <header><span class="ttl">QView · retained</span><button id="snap">Snap</button><button id="copy" disabled>Copy</button></header>
  <canvas id="gpu"></canvas>
  <input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  <textarea id="kbdm" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
  <!-- <div id="log">loading…</div> --> <!-- bring-up status line; status still goes to console.log -->

  <script type="module" src="./app.js"></script>
</body>
</html>
