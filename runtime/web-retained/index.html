<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07090d" />
<title>QView · retained · q64 → wasm32 → WebGPU</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07090d; color: #e6edf3;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: max(env(safe-area-inset-top), 0.75rem) 1rem 0; font: 600 0.8rem ui-monospace, monospace;
    letter-spacing: 0.2em; text-transform: uppercase; color: #5fd4ff; }
  /* touch-action:none — the canvas owns all gestures; without it the browser
     treats a vertical-ish drag (e.g. drifting toward a label) as a scroll and
     fires pointercancel, dropping a slider drag. */
  /* Also suppress the iOS long-press callout / text selection so a hold reaches
     our long-press handler instead of Safari's selection UI. */
  #gpu { flex: 1 1 auto; width: 100%; display: block; touch-action: none;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #log { padding: 0.5rem 1rem calc(env(safe-area-inset-bottom) + 0.5rem); font: 0.8rem ui-monospace, monospace; color: #6b7484; }
</style>
</head>
<body>
  <header>QView · retained</header>
  <canvas id="gpu"></canvas>
  <div id="log">loading…</div>
  <script type="module" src="./app.js"></script>
</body>
</html>
